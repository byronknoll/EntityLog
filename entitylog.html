<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Activity Log</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <!-- Preconnect to external APIs used for entity search / timeline rendering to shave DNS/TLS time off first requests -->
  <link rel="preconnect" href="https://nominatim.openstreetmap.org">
  <link rel="preconnect" href="https://www.wikidata.org">
  <link rel="preconnect" href="https://en.wikipedia.org">
  <link rel="preconnect" href="https://query.wikidata.org">
  <link rel="preconnect" href="https://openlibrary.org">
  <link rel="preconnect" href="https://docs.google.com">
  <link rel="preconnect" href="https://script.google.com">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif; background: #f2f4f8; margin: 0; }
    .container { max-width: 480px; margin: auto; padding: 20px; }
    h2 { text-align: center; color: #333; margin-bottom: 24px; }
    label { margin-top: 20px; display: block; font-weight: 600; color: #444; }
    input, select, button { padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    input, select { width: 100%; margin-top: 8px; }

    .search-row input { flex: 1; }

      padding: 10px 14px; background-color: #007aff; color: white; font-weight: bold; border: none; border-radius: 8px; cursor: pointer;
    }
    .search-row button:hover, .submit-button:hover, .export-button:hover { background-color: #005fcb; }
    .submit-button { width: 100%; margin-top: 24px; display: block; }
    .export-button { display: block; margin: 0 auto 10px; }
    .copy-link { cursor: pointer; color: #007aff; text-decoration: underline; font-size: 14px; margin-left: 6px; }
    #status, #loggingStatus, #loadingTimeline { margin-top: 10px; text-align: center; font-weight: bold; }
    #status { color: green; }
    .timeline { list-style: none; padding-left: 0; margin-top: 20px; }
    .timeline-item { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); margin-bottom: 16px; }
    .timeline-item h4 { margin: 0 0 8px; color: #007aff; }
    .timeline-item ul { padding-left: 20px; margin: 0; }
    .timeline-item li { margin-bottom: 6px; }
    #toast { visibility: hidden; min-width: 100px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 10px; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1; font-size: 16px; opacity: 0; transition: opacity 0.5s ease, visibility 0.5s; }
    #toast.show { visibility: visible; opacity: 1; }
  </style>
</head>

<body>
  <div class="container">
    <h2>Log Activity</h2>

    <label>Action (select or type your own):</label>
    <input list="actionList" id="action" placeholder="e.g. watched">
    <datalist id="actionList">
      <option value="watched">
      <option value="read">
      <option value="played">
      <option value="visited">
      <option value="biked at">
      <option value="camped at">
      <option value="exercised at">
      <option value="bouldered at">
      <option value="ate at">
      <option value="shopped at">
    </datalist>

    <label>Entity Search (Wikidata or OSM):</label>
    <div class="search-row">
      <input type="text" id="search" placeholder="e.g. The Dark Knight" onkeydown="if (event.key === 'Enter') searchEntities()">
      <button id="searchButton" onclick="searchEntities()">Search</button>
    </div>

    <label>Or Enter ISBN:</label>
    <div class="search-row">
      <input type="text" id="isbn" placeholder="e.g. 978-0-14-044913-6" onkeydown="if (event.key === 'Enter') addISBN()">
      <button id="isbnButton" type="button" onclick="addISBN()">Use ISBN</button>
    </div>

    <label>Selected Entity / Results:</label>
    <select id="resultSelect"></select>

    <label>Date:</label>
    <input type="date" id="date">

    <button id="logButton" class="submit-button" onclick="logActivity()">Log It</button>

    <p id="loggingStatus"></p>
    <p id="status"></p>

    <h2>Your Activity Timeline</h2>
    <button class="export-button" onclick="exportTimeline()">Export as Text</button>

    <p id="loadingTimeline"></p>

    <ul class="timeline" id="timeline"></ul>
  </div>

  <div id="toast">Copied!</div>

<script>
const webAppURL = "YOUR_WEB_APP_URL_HERE";
const SHEET_CSV_URL = "YOUR_SHEET_CSV_URL_HERE";
const TIMELINE_DAYS_LIMIT = 30;
let timelineText = "";
let showFullTimeline = false;
let allRows = [];
const entityCache = {};
let searchInFlight = false;
let loggingInFlight = false;
let buildTimelineInFlight = false;

// --- Fetch JSON from a URL, throwing a descriptive error on non-2xx responses
async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Request failed: ${url} (HTTP ${res.status})`);
  return res.json();
}

// --- Format a Date as YYYY-MM-DD in the user's local timezone (not UTC)
function toLocalDateString(date) {
  return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().split('T')[0];
}

// --- Batch fetch label/description (and optionally external IDs like Google Knowledge Graph / Freebase) for a list of Wikidata QIDs.
// Shared by searchEntities() (Wikipedia-derived results) and ensureEntityCache() (timeline rendering).
async function fetchWikidataBatch(qids, { includeExternalIds = false } = {}) {
  if (qids.length === 0) return {};

  const sparql = includeExternalIds ? `
    SELECT ?item ?itemLabel ?itemDescription (SAMPLE(?kgid) AS ?kgid) (SAMPLE(?freebase) AS ?freebase) WHERE {
      VALUES ?item { ${qids.map(id => `wd:${id}`).join(' ')} }
      OPTIONAL { ?item wdt:P2671 ?kgid. }
      OPTIONAL { ?item wdt:P646 ?freebase. }
      SERVICE wikibase:label { bd:serviceParam wikibase:language "en,mul". }
    }
    GROUP BY ?item ?itemLabel ?itemDescription
  ` : `
    SELECT ?item ?itemLabel ?itemDescription WHERE {
      VALUES ?item { ${qids.map(id => `wd:${id}`).join(' ')} }
      SERVICE wikibase:label { bd:serviceParam wikibase:language "en,mul". }
    }
  `;

  const data = await fetchJSON(`https://query.wikidata.org/sparql?format=json&query=${encodeURIComponent(sparql)}`);
  const result = {};
  data.results.bindings.forEach(entry => {
    const id = entry.item.value.split('/').pop();
    result[id] = {
      label: entry.itemLabel?.value || "(Unknown)",
      description: entry.itemDescription?.value || "(No description)",
      kgid: entry.kgid?.value || null,
      freebase: entry.freebase?.value || null
    };
  });
  return result;
}

// --- Normalize and clean ISBN string (removes 'isbn:' prefix, hyphens, spaces, uppercase 'X')
function cleanISBN(input) {
  if (!input) return "";
  return input.trim().replace(/^isbn:?\s*/i, "").replace(/[-\s]/g, "").toUpperCase();
}

// --- Check if string is a valid ISBN-10 or ISBN-13
function isValidISBN(isbn) {
  const cleaned = cleanISBN(isbn);
  return /^[0-9]{9}[0-9X]$/.test(cleaned) || /^(978|979)[0-9]{10}$/.test(cleaned);
}

// --- Batch fetch title, authors, and publish date for ISBNs via Open Library API
async function fetchISBNBatch(isbns) {
  if (isbns.length === 0) return {};

  const cleanMap = {};
  const cleanIsbns = [];
  for (const raw of isbns) {
    const cleaned = cleanISBN(raw);
    if (!cleaned) continue;
    if (!cleanMap[cleaned]) {
      cleanMap[cleaned] = new Set();
      cleanIsbns.push(cleaned);
    }
    cleanMap[cleaned].add(raw);
  }

  const result = {};
  // Process in batches of 30 to stay well within URL length limits
  for (let i = 0; i < cleanIsbns.length; i += 30) {
    const batch = cleanIsbns.slice(i, i + 30);
    const bibkeys = batch.map(id => `ISBN:${id}`).join(",");
    const url = `https://openlibrary.org/api/books?bibkeys=${encodeURIComponent(bibkeys)}&format=json&jscmd=data`;

    try {
      const data = await fetchJSON(url);
      for (const cleanId of batch) {
        const book = data[`ISBN:${cleanId}`];
        if (book) {
          const authorNames = (book.authors || []).map(a => a.name).filter(Boolean).join(", ");
          const authors = authorNames || book.by_statement || "";
          let desc = authors ? `by ${authors}` : "";
          if (book.publish_date) {
            desc = desc ? `${desc} (${book.publish_date})` : `Published ${book.publish_date}`;
          }
          let label = book.title || `ISBN ${cleanId}`;
          if (book.subtitle) {
            label += `: ${book.subtitle}`;
          }
          const item = {
            label,
            description: desc || "(Book)",
            url: (book.url || `https://openlibrary.org/isbn/${cleanId}`).replace(/^http:/, "https:")
          };
          result[cleanId] = item;
          for (const raw of cleanMap[cleanId]) {
            result[raw] = item;
          }
        } else {
          const fallback = {
            label: `ISBN ${cleanId}`,
            description: "(Book)",
            url: `https://openlibrary.org/isbn/${cleanId}`
          };
          result[cleanId] = fallback;
          for (const raw of cleanMap[cleanId]) {
            result[raw] = fallback;
          }
        }
      }
    } catch (err) {
      console.error("Open Library batch lookup error", err);
    }
  }

  return result;
}

// --- Add an ISBN directly to the entity selection
async function addISBN() {
  const isbnInput = document.getElementById("isbn");
  const rawValue = isbnInput ? isbnInput.value.trim() : "";
  const cleaned = cleanISBN(rawValue);

  if (!cleaned) {
    alert("Please enter an ISBN.");
    return;
  }
  if (!isValidISBN(cleaned)) {
    if (!confirm(`"${rawValue}" does not appear to be a standard 10- or 13-digit ISBN. Use it anyway?`)) {
      return;
    }
  }

  const select = document.getElementById("resultSelect");
  select.innerHTML = "";
  const option = document.createElement("option");
  option.value = `isbn:${cleaned}`;
  option.text = `[ISBN] ${cleaned} — Loading book details...`;
  option.selected = true;
  select.appendChild(option);

  // Set action to "read" by default if not set yet
  const actionInput = document.getElementById("action");
  if (!actionInput.value.trim()) {
    actionInput.value = "read";
  }

  // Clear entity search box
  document.getElementById("search").value = "";

  // Lookup metadata asynchronously to update display
  try {
    const bookData = await fetchISBNBatch([cleaned]);
    if (bookData[cleaned]) {
      entityCache[cleaned] = bookData[cleaned];
      option.text = `[ISBN] ${bookData[cleaned].label} (${cleaned}) — ${bookData[cleaned].description}`;
    } else {
      option.text = `[ISBN] ${cleaned}`;
    }
  } catch (err) {
    console.warn("Failed to fetch ISBN metadata:", err);
    option.text = `[ISBN] ${cleaned}`;
  }
}

window.onload = () => {
  document.getElementById("date").value = toLocalDateString(new Date());
  buildTimeline();
};

async function searchEntities() {
  if (searchInFlight) return; // ignore overlapping search requests

  const query = document.getElementById("search").value.trim();
  const select = document.getElementById("resultSelect");
  if (!query) { alert("Please enter a search term."); select.innerHTML = ""; return; }

  const searchButton = document.getElementById("searchButton");
  searchInFlight = true;
  if (searchButton) searchButton.disabled = true;
  select.innerHTML = "<option>Searching...</option>";

  try {
    let lat = null, lon = null;
    try {
      const pos = await new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 });
      });
      lat = pos.coords.latitude;
      lon = pos.coords.longitude;
    } catch (e) {
      console.warn("Could not get location, searching globally.");
    }

    // --- Kick off OSM local/global lookup now (only depends on lat/lon, not on Wikidata/Wikipedia)
    const hasLocation = lat !== null && lon !== null;
    let osmLocalURL = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;
    if (hasLocation) {
      osmLocalURL += `&viewbox=${lon-0.2},${lat+0.2},${lon+0.2},${lat-0.2}&bounded=1`;
    }
    // Without a location bias, the "global" query would be byte-for-byte identical to the local one — skip the redundant request
    const osmResultsPromise = Promise.allSettled([
      fetchJSON(osmLocalURL),
      hasLocation ? fetchJSON(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`) : Promise.resolve(null)
    ]);

    // --- Step 1 & 2: Wikidata Exact Search and Wikipedia Fulltext Search run in parallel.
    // Use allSettled so a failure in one doesn't blank out results from the other.
    const [wikidataExactSettled, wikipediaSettled] = await Promise.allSettled([
      fetchJSON(`https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(query)}&language=en&limit=5&format=json&origin=*`),
      fetchJSON(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`)
    ]);
    if (wikidataExactSettled.status === "rejected") console.error("Wikidata exact search failed:", wikidataExactSettled.reason);
    if (wikipediaSettled.status === "rejected") console.error("Wikipedia search failed:", wikipediaSettled.reason);
    const wikidataExactData = wikidataExactSettled.status === "fulfilled" ? wikidataExactSettled.value : { search: [] };
    const wikipediaData = wikipediaSettled.status === "fulfilled" ? wikipediaSettled.value : { query: { search: [] } };
    const exactResults = (wikidataExactData.search || []).map(item => ({
      qid: item.id,
      label: item.label,
      description: item.description || "(No description)"
    }));
    const searchResults = (wikipediaData.query && wikipediaData.query.search) || [];

    // Lookup Wikidata mappings for Wikipedia pages
    const titles = searchResults.map(r => r.title).join("|");
    const qidMap = {};
    if (titles) {
      const pagePropsData = await fetchJSON(`https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(titles)}&prop=pageprops&format=json&origin=*`);

      // Map Wikipedia titles to QIDs
      const pages = pagePropsData.query && pagePropsData.query.pages;
      for (const pageId in pages) {
        const page = pages[pageId];
        if (page.pageprops && page.pageprops.wikibase_item) {
          qidMap[page.title] = page.pageprops.wikibase_item;
        }
      }
    }

    // Now batch query Wikidata for real labels/descriptions
    const qidsFromWikipedia = Object.values(qidMap).filter(qid => !!qid);
    let wikidataInfo = {};

    if (qidsFromWikipedia.length > 0) {
      try {
        wikidataInfo = await fetchWikidataBatch(qidsFromWikipedia);
      } catch (err) {
        console.error("Wikidata SPARQL error", err);
      }
    }

    // Build the Wikipedia-based list (filtered to available QIDs)
    const wikipediaResults = [];
    for (const result of searchResults) {
      const qid = qidMap[result.title];
      if (qid && !exactResults.find(x => x.qid === qid) && wikidataInfo[qid]) { // deduplicate
        wikipediaResults.push({
          qid: qid,
          label: wikidataInfo[qid].label,
          description: wikidataInfo[qid].description
        });
      }
      if (wikipediaResults.length >= 5) break; // only take 5
    }

    // --- Step 3: OSM Local and Global (already kicked off above, just await it now)
    const [osmLocalSettled, osmGlobalSettled] = await osmResultsPromise;
    if (osmLocalSettled.status === "rejected") console.error("OSM local search failed:", osmLocalSettled.reason);
    const osmLocalRes = osmLocalSettled.status === "fulfilled" ? osmLocalSettled.value : [];
    // When there's no location bias, no separate global request was made — reuse the local results as-is
    let osmGlobalRes;
    if (!hasLocation) {
      osmGlobalRes = osmLocalRes;
    } else if (osmGlobalSettled.status === "fulfilled") {
      osmGlobalRes = osmGlobalSettled.value;
    } else {
      console.error("OSM global search failed:", osmGlobalSettled.reason);
      osmGlobalRes = [];
    }

    // --- Step 4: Display results
    select.innerHTML = "";

    // Exact Wikidata matches first
    const cleanedQueryIsbn = cleanISBN(query);
    if (isValidISBN(cleanedQueryIsbn)) {
      const isbnOption = document.createElement("option");
      isbnOption.value = `isbn:${cleanedQueryIsbn}`;
      isbnOption.text = `[ISBN] ${cleanedQueryIsbn}`;
      select.appendChild(isbnOption);
    }

    exactResults.forEach(item => {
      const option = document.createElement("option");
      option.value = `wikidata:${item.qid}`;
      option.text = `[Wikidata Exact] ${item.label} (${item.qid}) — ${item.description}`;
      select.appendChild(option);
    });

    // Wikipedia-based Wikidata matches second
    wikipediaResults.forEach(item => {
      const option = document.createElement("option");
      option.value = `wikidata:${item.qid}`;
      option.text = `[Wikidata Related] ${item.label} (${item.qid}) — ${item.description}`;
      select.appendChild(option);
    });

    // OSM local results
    osmLocalRes.forEach(item => {
      const osmId = `${item.osm_type.toLowerCase()}/${item.osm_id}`;
      const option = document.createElement("option");
      option.value = `osm:${osmId}`;
      option.text = `[OSM Nearby] ${item.display_name}`;
      select.appendChild(option);
    });

    // OSM global fallback results
    const localIds = new Set(osmLocalRes.map(item => `${item.osm_type.toLowerCase()}/${item.osm_id}`));
    osmGlobalRes.forEach(item => {
      const osmId = `${item.osm_type.toLowerCase()}/${item.osm_id}`;
      if (!localIds.has(osmId)) {
        const option = document.createElement("option");
        option.value = `osm:${osmId}`;
        option.text = `[OSM Global] ${item.display_name}`;
        select.appendChild(option);
      }
    });

    if (!select.options.length) {
      select.innerHTML = "<option>No results found</option>";
    }
  } catch (err) {
    console.error("Entity search failed:", err);
    select.innerHTML = "<option>Search failed — please try again</option>";
  } finally {
    searchInFlight = false;
    if (searchButton) searchButton.disabled = false;
  }
}

async function fetchOSMLabelsInBatch(osmIds) {
  if (osmIds.length === 0) return {};

  // Group all osm_ids into one lookup query
  const osmIdList = osmIds.map(osmId => {
    const [type, id] = osmId.split("/");
    const typeLetter = { node: "N", way: "W", relation: "R" }[type];
    return `${typeLetter}${id}`;
  }).filter(Boolean); // Remove bad ids

  const url = `https://nominatim.openstreetmap.org/lookup?osm_ids=${osmIdList.join(",")}&format=json`;
  const data = await fetchJSON(url);

  const result = {};
  if (Array.isArray(data)) {
    for (const place of data) {
      const osmId = `${place.osm_type.toLowerCase()}/${place.osm_id}`;
      let label = place.localname || place.display_name.split(",")[0] || "(Unknown)";
      let description = place.display_name || "(OpenStreetMap)";
      if (description.startsWith(label + ",")) {
        description = description.substring(label.length + 1).trim();
      }
      result[osmId] = { label, description };
    }
  }
  return result;
}

// --- Log Activity
async function logActivity() {
  if (loggingInFlight) return; // prevent duplicate submissions from rapid double-clicks

  let qid = document.getElementById("resultSelect").value.trim();
  const isbnInput = document.getElementById("isbn");
  if (!qid && isbnInput && isbnInput.value.trim()) {
    const cleaned = cleanISBN(isbnInput.value.trim());
    if (cleaned) {
      qid = `isbn:${cleaned}`;
    }
  }

  const action = document.getElementById("action").value.trim().toLowerCase();
  const selectedDate = document.getElementById("date").value;
  if (!qid || !action || !selectedDate) { alert("Please complete all fields."); return; }

  const logButton = document.getElementById("logButton");
  loggingInFlight = true;
  if (logButton) logButton.disabled = true;
  document.getElementById("loggingStatus").innerText = "Logging activity...";

  try {
    const body = new URLSearchParams({ action, qid, timestamp: selectedDate });
    await fetch(webAppURL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body });
    document.getElementById("status").textContent = `Logged successfully for ${selectedDate}!`;
    document.getElementById("search").value = "";
    if (document.getElementById("isbn")) document.getElementById("isbn").value = "";
    document.getElementById("resultSelect").innerHTML = "";
    document.getElementById("action").value = "";
    document.getElementById("date").value = toLocalDateString(new Date());
    await buildTimeline(true); // force refresh so the newly logged entry shows up
  } catch (err) {
    console.error("Failed to log activity:", err);
    document.getElementById("status").textContent = "Failed to log activity — please try again.";
  } finally {
    document.getElementById("loggingStatus").innerText = "";
    loggingInFlight = false;
    if (logButton) logButton.disabled = false;
  }
}

// --- Fetch any Wikidata/OSM/ISBN entity info referenced by `rows` that isn't cached yet
async function ensureEntityCache(rows) {
  const qidsToFetch = new Set();
  const osmsToFetch = new Set();
  const isbnsToFetch = new Set();

  for (const [, , qid] of rows) {
    const trimmedQid = (qid || "").trim();
    if (trimmedQid.startsWith("wikidata:")) {
      const id = trimmedQid.split(":")[1];
      if (!entityCache[id]) qidsToFetch.add(id);
    } else if (trimmedQid.startsWith("osm:")) {
      const id = trimmedQid.split(":")[1];
      if (!entityCache[id]) osmsToFetch.add(id);
    } else if (trimmedQid.startsWith("isbn:")) {
      const id = trimmedQid.slice(5).trim();
      const cleanId = cleanISBN(id);
      if (!entityCache[id] && !entityCache[cleanId]) isbnsToFetch.add(id);
    }
  }

  // --- Batch fetch missing Wikidata entries
  if (qidsToFetch.size > 0) {
    try {
      const wikidataInfo = await fetchWikidataBatch(Array.from(qidsToFetch), { includeExternalIds: true });
      Object.assign(entityCache, wikidataInfo);
    } catch (err) {
      console.error("Wikidata SPARQL error during timeline build.", err);
    }
  }

  // --- Batch fetch missing OSM labels
  if (osmsToFetch.size > 0) {
    try {
      const osmArray = Array.from(osmsToFetch);
      const osmData = await fetchOSMLabelsInBatch(osmArray);
      for (const id in osmData) {
        entityCache[id] = osmData[id];
      }
    } catch (err) {
      console.error("OSM lookup error during timeline build.", err);
    }
  }

  // --- Batch fetch missing ISBN book details
  if (isbnsToFetch.size > 0) {
    try {
      const isbnInfo = await fetchISBNBatch(Array.from(isbnsToFetch));
      Object.assign(entityCache, isbnInfo);
    } catch (err) {
      console.error("Open Library lookup error during timeline build.", err);
    }
  }
}

// --- Group rows by timestamp
function groupRowsByTimestamp(rows) {
  const grouped = {};
  for (const [timestamp, action, qid] of rows) {
    if (!grouped[timestamp]) grouped[timestamp] = [];
    grouped[timestamp].push({ action, qid });
  }
  return grouped;
}

// --- Build the plain-text timeline export for a set of rows (assumes entityCache is populated)
function renderTimelineText(rows) {
  const grouped = groupRowsByTimestamp(rows);
  let text = "";
  for (const timestamp of Object.keys(grouped).sort().reverse()) {
    text += `\n${timestamp}\n`;
    for (const { action, qid } of grouped[timestamp]) {
      const trimmedQid = (qid || "").trim();
      let label = trimmedQid;
      let description = "";

      if (trimmedQid.startsWith("wikidata:") || trimmedQid.startsWith("osm:")) {
        const id = trimmedQid.split(":")[1];
        const data = entityCache[id];
        label = data?.label || "(Unknown)";
        description = data?.description || (trimmedQid.startsWith("osm:") ? "(OpenStreetMap)" : "(No description)");
      } else if (trimmedQid.startsWith("isbn:")) {
        const id = trimmedQid.slice(5).trim();
        const cleanId = cleanISBN(id);
        const data = entityCache[cleanId] || entityCache[id];
        label = data?.label || `ISBN ${id}`;
        description = data?.description || "(Book)";
      }

      text += `- You ${action} "${label}" — ${description}\n`;
    }
  }
  return text;
}

// --- Minimal RFC4180-style CSV parser (handles quoted fields with embedded commas/newlines/escaped quotes)
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (inQuotes) {
      if (char === '"' && next === '"') {
        field += '"';
        i++;
      } else if (char === '"') {
        inQuotes = false;
      } else {
        field += char;
      }
    } else if (char === '"') {
      inQuotes = true;
    } else if (char === ',') {
      row.push(field);
      field = "";
    } else if (char === '\r') {
      // ignore; \n (handled below) marks the actual row end
    } else if (char === '\n') {
      row.push(field);
      rows.push(row);
      row = [];
      field = "";
    } else {
      field += char;
    }
  }

  if (field.length > 0 || row.length > 0) {
    row.push(field);
    rows.push(row);
  }

  return rows;
}

// --- Fetch timeline rows from the sheet, reusing the cached copy unless a refresh is forced
async function fetchTimelineRows(forceRefresh = false) {
  if (allRows.length > 0 && !forceRefresh) return allRows;

  const res = await fetch(SHEET_CSV_URL);
  if (!res.ok) throw new Error(`Failed to load activity sheet (HTTP ${res.status})`);
  const text = await res.text();
  const parsedRows = parseCSV(text);
  parsedRows.shift(); // remove header
  // Drop blank/malformed rows (e.g. stray blank lines) that are missing a timestamp or entity id
  allRows = parsedRows.filter(row => (row[0] || "").trim() && (row[2] || "").trim());
  return allRows;
}

// --- Build Timeline
async function buildTimeline(forceRefresh = false) {
  if (buildTimelineInFlight) return; // avoid overlapping rebuilds

  buildTimelineInFlight = true;
  const timeline = document.getElementById("timeline");
  timeline.innerHTML = "";
  document.getElementById("loadingTimeline").innerText = "Loading timeline...";
  timelineText = "";

  try {
    const rows = await fetchTimelineRows(forceRefresh);

    let hasOlderEntries = false;
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - TIMELINE_DAYS_LIMIT);
    const cutoffStr = toLocalDateString(cutoff);

    const displayRows = [];
    for (const row of rows) {
      const [timestamp] = row;
      if (timestamp < cutoffStr) {
        hasOlderEntries = true;
        if (!showFullTimeline) continue;
      }
      displayRows.push(row);
    }

    // --- Fetch any entity info needed for the rows currently being displayed
    await ensureEntityCache(displayRows);

    const grouped = groupRowsByTimestamp(displayRows);

    for (const timestamp of Object.keys(grouped).sort().reverse()) {
      const dayEntry = document.createElement("li");
      dayEntry.className = "timeline-item";

      const dayHeader = document.createElement("h4");
      dayHeader.textContent = timestamp;
      dayEntry.appendChild(dayHeader);

      const list = document.createElement("ul");

      for (const { action, qid } of grouped[timestamp]) {
        const trimmedQid = (qid || "").trim();
        let label = trimmedQid;
        let description = "";
        let link = "";

        if (trimmedQid.startsWith("wikidata:")) {
          const id = trimmedQid.split(":")[1];
          const data = entityCache[id];
          label = data?.label || "(Unknown)";
          description = data?.description || "(No description)";

          if (data?.kgid) {
            link = `https://www.google.com/search?kgmid=${data.kgid}`;
          } else if (data?.freebase) {
            link = `https://www.google.com/search?kgmid=${data.freebase}`;
          } else {
            link = `https://www.wikidata.org/wiki/${id}`;
          }
        } else if (trimmedQid.startsWith("osm:")) {
          const id = trimmedQid.split(":")[1];
          const data = entityCache[id];
          label = data?.label || "(Unknown)";
          description = data?.description || "(OpenStreetMap)";
          link = `https://www.openstreetmap.org/${id}`;
        } else if (trimmedQid.startsWith("isbn:")) {
          const id = trimmedQid.slice(5).trim();
          const cleanId = cleanISBN(id);
          const data = entityCache[cleanId] || entityCache[id];
          label = data?.label || `ISBN ${id}`;
          description = data?.description || "(Book)";
          link = data?.url ? data.url.replace(/^http:/, "https:") : `https://openlibrary.org/isbn/${encodeURIComponent(cleanId || id)}`;
        }

        const itemEl = document.createElement("li");
        itemEl.appendChild(document.createTextNode(`You ${action} `));

        const anchor = document.createElement("a");
        anchor.href = link;
        anchor.target = "_blank";
        anchor.rel = "noopener noreferrer";
        const strong = document.createElement("strong");
        strong.textContent = `"${label}"`;
        anchor.appendChild(strong);
        itemEl.appendChild(anchor);

        itemEl.appendChild(document.createTextNode(` — ${description} `));

        const copySpan = document.createElement("span");
        copySpan.className = "copy-link";
        copySpan.textContent = "[copy]";
        copySpan.dataset.qid = trimmedQid;
        copySpan.dataset.action = action;
        copySpan.dataset.label = label;
        copySpan.addEventListener("click", () => copyActivity(copySpan));
        itemEl.appendChild(copySpan);

        list.appendChild(itemEl);
      }

      dayEntry.appendChild(list);
      timeline.appendChild(dayEntry);
    }

    timelineText = renderTimelineText(displayRows);

    // Only offer to expand to the full timeline; once it's loaded there's no need to collapse back
    if (hasOlderEntries && !showFullTimeline) {
      const toggleEntry = document.createElement("li");
      toggleEntry.className = "timeline-toggle";
      const toggleButton = document.createElement("button");
      toggleButton.className = "export-button";
      toggleButton.textContent = "View Full Timeline";
      toggleButton.onclick = () => {
        showFullTimeline = true;
        buildTimeline();
      };
      toggleEntry.appendChild(toggleButton);
      timeline.appendChild(toggleEntry);
    }

    document.getElementById("loadingTimeline").innerText = "";
  } catch (err) {
    console.error("Failed to build timeline:", err);
    document.getElementById("loadingTimeline").innerText = "Failed to load timeline. Please try again.";
  } finally {
    buildTimelineInFlight = false;
  }
}

// --- Export Timeline (always exports the full history, regardless of what's currently displayed)
async function exportTimeline() {
  document.getElementById("loadingTimeline").innerText = "Preparing full export...";

  try {
    await ensureEntityCache(allRows);
    const fullTimelineText = renderTimelineText(allRows);

    const textWindow = window.open("", "_blank");
    if (!textWindow) {
      alert("Please allow pop-ups to export the timeline.");
      return;
    }
    textWindow.opener = null; // sever reverse-tabnabbing access to this page
    textWindow.document.title = "Exported Activity Log";
    const pre = textWindow.document.createElement("pre");
    pre.textContent = fullTimelineText.trim();
    textWindow.document.body.appendChild(pre);
  } catch (err) {
    console.error("Failed to export timeline:", err);
    alert("Failed to prepare the export. Please try again.");
  } finally {
    document.getElementById("loadingTimeline").innerText = "";
  }
}

// --- Copy Activity
function copyActivity(el) {
  document.getElementById("action").value = el.dataset.action;
  const select = document.getElementById("resultSelect");
  select.innerHTML = ""; // clear stale search results before inserting the copied entry
  const newOption = document.createElement("option");
  newOption.value = el.dataset.qid;
  newOption.text = el.dataset.label;
  newOption.selected = true;
  select.appendChild(newOption);
  if (el.dataset.qid && el.dataset.qid.startsWith("isbn:")) {
    const isbnEl = document.getElementById("isbn");
    if (isbnEl) isbnEl.value = el.dataset.qid.slice(5).trim();
  }
  showToast("Copied!");
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// --- Show Toast
function showToast(message) {
  const toast = document.getElementById("toast");
  toast.innerText = message;
  toast.className = "show";
  setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2000);
}
</script>
